<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visor de símbolos TeleTrader vinculados a un asset.">
  <title>Dataset · TTS Symbols Guide</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260824-6">
</head>
<body>
  <main class="page-shell">
    <nav class="topbar" aria-label="Navegación">
      <a class="back-link" href="index.html">← Volver al índice</a>
      <a class="source-link" id="source-link" href="#" hidden>Ver respuesta XML</a>
    </nav>

    <header class="dataset-head">
      <div>
        <h1 id="dataset-title">Cargando…</h1>
        <p class="dataset-description" id="dataset-description">Leyendo el catálogo y los datos.</p>
      </div>
    </header>

    <div class="loading-card" id="loading" role="status">Procesando XML…</div>
    <div class="loading-card status error" id="error" role="alert" hidden></div>

    <section id="viewer" hidden>
      <p class="summary" id="dataset-summary" aria-label="Resumen del dataset"></p>

      <form class="filters" id="filters" aria-label="Filtros">
        <div class="field">
          <label for="search">Buscar en todos los campos</label>
          <input id="search" type="search" placeholder="Ticker, nombre, ID…" autocomplete="off">
        </div>
        <div class="field">
          <label for="exchange-filter">Exchange</label>
          <select id="exchange-filter"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="type-filter">Tipo</label>
          <select id="type-filter"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="currency-filter">Moneda</label>
          <select id="currency-filter"><option value="">Todas</option></select>
        </div>
        <button class="reset" type="reset">Limpiar</button>
      </form>

      <div class="table-shell">
        <div class="table-meta">
          <span id="result-count">0 resultados</span>
          <span id="xml-status">errorNumber: —</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th data-key="tickerSymbol" tabindex="0">Ticker</th>
                <th data-key="name" tabindex="0">Nombre</th>
                <th data-key="uniqueName" tabindex="0">Nombre único</th>
                <th data-key="stockExchangeName" tabindex="0">Exchange</th>
                <th data-key="currency" tabindex="0">Moneda</th>
                <th data-key="typeNameEng" tabindex="0">Tipo</th>
                <th data-key="tradingTimeStart" tabindex="0">Horario</th>
                <th data-key="id" tabindex="0">Symbol ID</th>
                <th>TEST</th>
              </tr>
            </thead>
            <tbody id="symbol-rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <dialog class="test-dialog" id="test-dialog" aria-labelledby="test-dialog-title">
    <form class="test-dialog-card" id="test-dialog-form" method="dialog">
      <h2 id="test-dialog-title">Verificar URL de TEST</h2>
      <p>Revisa o modifica los parámetros antes de continuar.</p>
      <ul id="test-warnings"></ul>
      <div class="test-parameters">
        <label for="test-asset">asset <span class="required-mark">Requerido</span>
          <input id="test-asset" name="asset" type="text" placeholder="Escribe testMode" autocomplete="off" required>
        </label>
        <label for="test-provider-code">testProviderCode <span class="required-mark">Requerido</span>
          <input id="test-provider-code" name="testProviderCode" type="text" inputmode="numeric" autocomplete="off" required>
        </label>
        <label for="test-session">sessiontest
          <input id="test-session" name="sessiontest" type="text" autocomplete="off">
        </label>
        <label for="test-type">testType
          <input id="test-type" name="testType" type="text" autocomplete="off">
        </label>
      </div>
      <label for="test-url">URL resultante</label>
      <textarea id="test-url" rows="4" readonly spellcheck="false"></textarea>
      <p class="dialog-error" id="test-dialog-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="test-cancel">Cancelar</button>
        <button type="submit" class="primary">Abrir TEST</button>
      </div>
    </form>
  </dialog>

  <script src="assets/template.js?v=20260824-6" defer></script>
</body>
</html>
