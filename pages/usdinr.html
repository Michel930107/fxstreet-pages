<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GetSymbols — USDINR Search</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--content-color-primary);
    padding: var(--spacing-m, 12px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--spacing-m, 12px);
    flex-wrap: wrap;
    gap: 8px;
  }

  .title { font-size: 15px; font-weight: 600; color: var(--content-color-primary); }
  .badge { background: var(--background-color-secondary, #f0f0f0); color: var(--content-color-secondary, #666); border-radius: 12px; padding: 2px 10px; font-size: 11px; font-weight: 500; }

  .kpi-row { display: flex; gap: 8px; margin-bottom: var(--spacing-m, 12px); flex-wrap: wrap; }
  .kpi { flex: 1; min-width: 100px; background: var(--background-color-secondary, #f5f5f5); border-radius: 8px; padding: 10px 14px; text-align: center; }
  .kpi-value { font-size: 22px; font-weight: 700; color: var(--content-color-primary); }
  .kpi-label { font-size: 10px; color: var(--content-color-secondary, #888); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  .search-bar { width: 100%; padding: 6px 10px; border: 1px solid var(--border-color-default, #ddd); border-radius: 6px; background: var(--background-color-primary, #fff); color: var(--content-color-primary); font-size: 12px; margin-bottom: 8px; outline: none; }
  .search-bar:focus { border-color: var(--content-color-brand, #ff6c37); }
  .table-wrap { overflow-x: auto; overflow-y: auto; max-height: 320px; border: 1px solid var(--border-color-default, #e0e0e0); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead { position: sticky; top: 0; z-index: 2; background: var(--background-color-secondary, #f5f5f5); }
  th { padding: 8px 10px; text-align: left; font-weight: 600; color: var(--content-color-secondary, #666); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--border-color-default, #e0e0e0); }
  th:hover { color: var(--content-color-primary); }
  th .sort-icon { margin-left: 4px; opacity: 0.4; }
  th.asc .sort-icon::after { content: " ▲"; opacity: 1; }
  th.desc .sort-icon::after { content: " ▼"; opacity: 1; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border-color-default, #f0f0f0); white-space: nowrap; color: var(--content-color-primary); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--background-color-secondary, #f9f9f9); }

  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .tag-dx { background: #e8f4fd; color: #1a6fa8; }
  .tag-dxall { background: #edf7ed; color: #2e7d32; }
  .mono { font-family: "Courier New", monospace; font-size: 11px; }
  .caption { font-size: 10px; color: var(--content-color-secondary, #999); margin-top: 6px; text-align: right; }
  .no-results { text-align: center; padding: 20px; color: var(--content-color-secondary, #999); font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <span class="title">GetSymbols — USDINR Search</span>
  <span class="badge" id="count-badge">12 symbols</span>
</div>

<div class="kpi-row">
  <div class="kpi"><div class="kpi-value">12</div><div class="kpi-label">Total Symbols</div></div>
  <div class="kpi"><div class="kpi-value">2</div><div class="kpi-label">Exchanges</div></div>
  <div class="kpi"><div class="kpi-value">Currency</div><div class="kpi-label">Type</div></div>
  <div class="kpi"><div class="kpi-value">00:00–23:59</div><div class="kpi-label">Trading Hours</div></div>
</div>

<input class="search-bar" type="text" id="searchInput" placeholder="Filter by ticker, exchange, unique name…" aria-label="Filter symbols"/>

<div class="table-wrap" role="region" aria-label="Symbol results table">
  <table id="symbolTable" aria-label="USD/INR Symbol List">
    <thead>
      <tr>
        <th data-col="ticker" tabindex="0">Ticker <span class="sort-icon"></span></th>
        <th data-col="name" tabindex="0">Name <span class="sort-icon"></span></th>
        <th data-col="uniqueName" tabindex="0">Unique Name <span class="sort-icon"></span></th>
        <th data-col="exchange" tabindex="0">Exchange <span class="sort-icon"></span></th>
        <th data-col="id" tabindex="0">Symbol ID <span class="sort-icon"></span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>
<div class="caption" id="caption">Showing 12 of 12 symbols · errorNumber: 0 · search: USDINR</div>

<script>
const symbols = [
  { id: "tts-178511350", name: "USD/INR Spot", ticker: "USDINRMSFX",  uniqueName: "USD/INR_DX",           exchange: "DX Forex",     exchangeID: 19 },
  { id: "tts-179859090", name: "USD/INR Spot", ticker: "USDINRSURF",  uniqueName: "USD/INR_SURF_DX",      exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-179859120", name: "USD/INR Spot", ticker: "USDINRMORN",  uniqueName: "USD/INR_MORN_DX",      exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-179859156", name: "USD/INR Spot", ticker: "USDINRBNPF",  uniqueName: "USD/INR_BNPF_DX",      exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-179859187", name: "USD/INR Spot", ticker: "USDINRDRES",  uniqueName: "USD/INR_DRES_DX",      exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-179859297", name: "USD/INR Spot", ticker: "USDINRRADA",  uniqueName: "USD/INR_RADA_DX",      exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-347727426", name: "USD/INR Spot", ticker: "USDINR",      uniqueName: "USD/INR:AFX_DX",       exchange: "DX Forex",     exchangeID: 19 },
  { id: "tts-347727427", name: "USD/INR Spot", ticker: "USDINRAFX",   uniqueName: "USD/INR:AFX_AFX_DX",   exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-347727449", name: "USD/INR Spot", ticker: "USDINRCOMP",  uniqueName: "USD/INR_COMP_DX",      exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-347727476", name: "USD/INR Spot", ticker: "USDINRCUR1",  uniqueName: "USD/INR:AFX_CUR1_DX",  exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-347727491", name: "USD/INR Spot", ticker: "USDINRCFH2",  uniqueName: "USD/INR:AFX_CFH2_DX",  exchange: "DX Forex All", exchangeID: 22 },
  { id: "tts-347729178", name: "USD/INR Spot", ticker: "USDINRCUR2",  uniqueName: "USD/INR:AFX_CUR2_DX",  exchange: "DX Forex All", exchangeID: 22 },
];

let sortCol = null;
let sortDir = 1;
let filterText = "";

function exchangeTag(ex) {
  const cls = ex === "DX Forex" ? "tag-dx" : "tag-dxall";
  return `<span class="tag ${cls}">${ex}</span>`;
}

function render() {
  let data = symbols.filter(s => {
    if (!filterText) return true;
    const q = filterText.toLowerCase();
    return s.ticker.toLowerCase().includes(q)
        || s.uniqueName.toLowerCase().includes(q)
        || s.exchange.toLowerCase().includes(q)
        || s.id.toLowerCase().includes(q);
  });

  if (sortCol) {
    data = [...data].sort((a, b) => {
      const av = a[sortCol] || "";
      const bv = b[sortCol] || "";
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }

  const tbody = document.getElementById("tableBody");
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="no-results">No symbols match your filter.</td></tr>`;
  } else {
    tbody.innerHTML = data.map(s => `
      <tr>
        <td class="mono">${s.ticker}</td>
        <td>${s.name}</td>
        <td class="mono" style="font-size:10px">${s.uniqueName}</td>
        <td>${exchangeTag(s.exchange)}</td>
        <td class="mono" style="font-size:10px;color:var(--content-color-secondary)">${s.id}</td>
      </tr>
    `).join("");
  }

  document.getElementById("count-badge").textContent = `${data.length} symbol${data.length !== 1 ? "s" : ""}`;
  document.getElementById("caption").textContent = `Showing ${data.length} of ${symbols.length} symbols · errorNumber: 0 · search: USDINR`;
}

document.querySelectorAll("th[data-col]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir *= -1;
      th.classList.toggle("asc", sortDir === 1);
      th.classList.toggle("desc", sortDir === -1);
    } else {
      document.querySelectorAll("th").forEach(t => t.classList.remove("asc", "desc"));
      sortCol = col;
      sortDir = 1;
      th.classList.add("asc");
    }
    render();
  });
  th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") th.click(); });
});

document.getElementById("searchInput").addEventListener("input", e => {
  filterText = e.target.value.trim();
  render();
});

render();
</script>
</body>
</html>
